<!doctype html>
<html lang="es" class="no-js is-locked">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Convivio Navideño · Pastoral Social Cáritas</title>
  <meta name="description" content="¡Tienes una invitación especial! Acompáñanos a celebrar el Convivio Navideño de Pastoral Social Cáritas.">
  <meta name="theme-color" content="#04190c">

  <!-- Vista previa al compartir por WhatsApp / redes.
       Después de publicar el sitio, reemplaza og:image y og:url por direcciones ABSOLUTAS
       (p. ej. https://tu-dominio.com/assets/img/og-cover.jpg). -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Convivio Navideño · Pastoral Social Cáritas">
  <meta property="og:description" content="¡Tienes una invitación especial! Abre el sobre y acompáñanos a celebrar la Navidad.">
  <meta property="og:image" content="assets/img/og-cover.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/intro.css">
  <link rel="stylesheet" href="css/sections.css">

  <script>document.documentElement.classList.replace('no-js', 'js');</script>
  <script src="js/config.js" defer></script>
  <script src="js/modules/content.js" defer></script>
  <script src="js/modules/decor.js" defer></script>
  <script src="js/modules/snow.js" defer></script>
  <script src="js/modules/music.js" defer></script>
  <script src="js/modules/effects.js" defer></script>
  <script src="js/modules/intro.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>

  <!-- ============ Iconos y símbolos reutilizables ============ -->
  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#9c7218"/>
        <stop offset=".3" stop-color="#f3dc8c"/>
        <stop offset=".55" stop-color="#cfa53a"/>
        <stop offset=".75" stop-color="#fff0b8"/>
        <stop offset="1" stop-color="#a87c20"/>
      </linearGradient>
      <radialGradient id="g-seal" cx=".38" cy=".32" r=".75">
        <stop offset="0" stop-color="#fff3c4"/>
        <stop offset=".35" stop-color="#e2bd55"/>
        <stop offset=".75" stop-color="#b48526"/>
        <stop offset="1" stop-color="#7c5711"/>
      </radialGradient>
      <radialGradient id="g-red" cx=".35" cy=".3" r=".8">
        <stop offset="0" stop-color="#ff6b5e"/><stop offset=".45" stop-color="#d00000"/><stop offset="1" stop-color="#5e0000"/>
      </radialGradient>
      <radialGradient id="g-green" cx=".35" cy=".3" r=".8">
        <stop offset="0" stop-color="#5fd37a"/><stop offset=".45" stop-color="#008000"/><stop offset="1" stop-color="#012e0b"/>
      </radialGradient>
      <radialGradient id="g-goldball" cx=".35" cy=".3" r=".8">
        <stop offset="0" stop-color="#fff6cf"/><stop offset=".4" stop-color="#d9b04a"/><stop offset="1" stop-color="#6e4b0c"/>
      </radialGradient>
      <radialGradient id="g-glow">
        <stop offset="0" stop-color="#fff3c4" stop-opacity=".95"/>
        <stop offset=".35" stop-color="#ffd76a" stop-opacity=".45"/>
        <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
      </radialGradient>
      <pattern id="p-liner" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="10" height="10" fill="#0a4a1b"/>
        <rect width="5" height="5" fill="#0d5a21"/>
        <circle cx="5" cy="5" r=".9" fill="#d4af37" opacity=".8"/>
      </pattern>
    </defs>

    <!-- Iconos de línea (24×24) -->
    <symbol id="i-recepcion" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19.5c.6-3.3 2.8-5.2 5.5-5.2s4.9 1.9 5.5 5.2"/><circle cx="16.8" cy="9" r="2.5"/><path d="M15.6 14.3c2.6-.3 4.5 1.4 5 4.4"/></symbol>
    <symbol id="i-misa" viewBox="0 0 24 24"><path d="M12 1.8v4.4M10 3.6h4"/><path d="M5 21V11.4l7-5.2 7 5.2V21"/><path d="M9.8 21v-3.8a2.2 2.2 0 0 1 4.4 0V21"/><path d="M2.5 21h19"/><circle cx="12" cy="12.2" r="1.6"/></symbol>
    <symbol id="i-traslado" viewBox="0 0 24 24"><circle cx="5.5" cy="18.5" r="2"/><path d="M18 3.2c-2 0-3.5 1.5-3.5 3.4 0 2.4 3.5 5.6 3.5 5.6s3.5-3.2 3.5-5.6c0-1.9-1.5-3.4-3.5-3.4Z"/><circle cx="18" cy="6.6" r=".9"/><path d="M7.5 18.5h7a3 3 0 0 0 0-6H10"/></symbol>
    <symbol id="i-palabras" viewBox="0 0 24 24"><rect x="9" y="2.8" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21M9 21h6"/></symbol>
    <symbol id="i-convivio" viewBox="0 0 24 24"><path d="M4.3 4.5 9 3.4l1 4.7a2.6 2.6 0 0 1-5.1 1.1Z"/><path d="M7.6 10.4 8.8 16M6.4 16.6l4.4-.9"/><path d="M19.7 4.5 15 3.4l-1 4.7a2.6 2.6 0 0 0 5.1 1.1Z"/><path d="M16.4 10.4 15.2 16M17.6 16.6l-4.4-.9"/><path d="M12 1.5v2M10.2 4.6l-.9-.9M13.8 4.6l.9-.9"/><path d="M4 21h16"/></symbol>
    <symbol id="i-comida" viewBox="0 0 24 24"><path d="M3 17.5h18"/><path d="M5 17.5a7 7 0 0 1 14 0"/><path d="M12 8.5V7M10.4 7h3.2"/><path d="M4.5 20.5h15"/><path d="M8.4 13.5a4.3 4.3 0 0 1 2.4-1.8"/></symbol>
    <symbol id="i-juegos" viewBox="0 0 24 24"><rect x="3.5" y="9" width="17" height="4" rx="1"/><path d="M5 13v8h14v-8"/><path d="M12 9v12"/><path d="M12 9C10.6 6 6.5 5 6.5 7.5S10 9 12 9Zm0 0c1.4-3 5.5-4 5.5-1.5S14 9 12 9Z"/></symbol>
    <symbol id="i-celebracion" viewBox="0 0 24 24"><path d="M11 3.5l1.7 4.9 4.9 1.7-4.9 1.7L11 16.7l-1.7-4.9-4.9-1.7 4.9-1.7Z"/><path d="M18.5 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8Z"/><path d="M5 17.5v3M3.5 19h3"/></symbol>
    <symbol id="i-cierre" viewBox="0 0 24 24"><path d="M12 20.5s-7.8-4.7-7.8-10.3A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 7.8 2.6c0 5.6-7.8 10.3-7.8 10.3Z"/></symbol>
    <symbol id="i-calendario" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M12 12.6l.9 1.9 2 .3-1.5 1.4.4 2-1.8-1-1.8 1 .4-2-1.5-1.4 2-.3Z"/></symbol>
    <symbol id="i-reloj" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.2V12l3.2 2"/></symbol>
    <symbol id="i-lugar" viewBox="0 0 24 24"><path d="M12 21.3s-6.6-6.2-6.6-11.1a6.6 6.6 0 0 1 13.2 0c0 4.9-6.6 11.1-6.6 11.1Z"/><circle cx="12" cy="10" r="2.4"/></symbol>
    <symbol id="i-mapa" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></symbol>
    <symbol id="i-compartir" viewBox="0 0 24 24"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="m8.2 10.8 7.6-4.1M8.2 13.2l7.6 4.1"/></symbol>
    <symbol id="i-agregar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.2"/><path d="M3.5 10h17M8 3v4M16 3v4M12 12.5v5M9.5 15h5"/></symbol>
    <symbol id="i-nota" viewBox="0 0 24 24"><path d="M9 18V5.2l11-2.2v12.8"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="15.8" r="2.5"/><path d="M9 9.2 20 7"/></symbol>
    <symbol id="i-flecha" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>

    <!-- Formas rellenas -->
    <symbol id="s-estrella" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8Z"/></symbol>
    <symbol id="s-belen" viewBox="0 0 100 100">
      <path d="M50 0 L54.5 45.5 L100 50 L54.5 54.5 L50 100 L45.5 54.5 L0 50 L45.5 45.5Z"/>
      <path d="M50 50 L76 24 L52.5 52.5 L76 76 L50 50 L24 76 L47.5 52.5 L24 24Z" opacity=".75"/>
      <path d="M50 22 L53 47 L78 50 L53 53 L50 78 L47 53 L22 50 L47 47Z" transform="rotate(45 50 50)" opacity=".9"/>
    </symbol>
    <symbol id="s-acebo" viewBox="0 0 100 60">
      <g fill="#0d5e22"><path d="M50 34 Q44 32 42 26 Q38 29 35 27 Q35 22 31 20 Q28 23 24 21 Q24 16 20 14 Q17 17 13 15 Q12 10 6 9 Q13 3 20 6 Q22 2 27 4 Q29 8 33 7 Q36 3 40 6 Q41 11 45 12 Q49 10 51 14 Q49 19 52 23 Q55 28 50 34Z"/></g>
      <g fill="#14772d"><path d="M50 34 Q56 32 58 26 Q62 29 65 27 Q65 22 69 20 Q72 23 76 21 Q76 16 80 14 Q83 17 87 15 Q88 10 94 9 Q87 3 80 6 Q78 2 73 4 Q71 8 67 7 Q64 3 60 6 Q59 11 55 12 Q51 10 49 14 Q51 19 48 23 Q45 28 50 34Z"/></g>
      <path d="M50 33 Q35 20 9 10M50 33 Q65 20 91 10" stroke="#0a4318" stroke-width="1" fill="none"/>
      <circle cx="45" cy="38" r="6.5" fill="url(#g-red)"/><circle cx="56" cy="38" r="6.5" fill="url(#g-red)"/><circle cx="50.5" cy="47" r="6.5" fill="url(#g-red)"/>
    </symbol>
    <!-- El sello y la rama de pino se generan en js/modules/decor.js -->
  </svg>

  <canvas class="snow" id="snow" aria-hidden="true"></canvas>
  <div class="scroll-progress" aria-hidden="true"><span></span></div>

  <!-- ============ 1. EXPERIENCIA INICIAL: SOBRE ============ -->
  <div class="intro" id="intro" role="dialog" aria-modal="true" aria-labelledby="intro-title">
    <div class="intro__bg" aria-hidden="true">
      <div class="intro__glow"></div>
      <svg class="intro__pine intro__pine--tl"><use href="#s-pino"/></svg>
      <svg class="intro__pine intro__pine--br"><use href="#s-pino"/></svg>
      <div class="sparkles" data-sparkles="22"></div>
    </div>
    <div class="intro__flash" aria-hidden="true"></div>

    <header class="intro__header">
      <p class="intro__kicker" data-content="organizacion"></p>
      <h1 class="intro__title" id="intro-title" data-content="sobre.titulo"></h1>
    </header>

    <div class="scene" id="scene">
      <div class="scene__float">
        <div class="env env--back" aria-hidden="true"></div>

        <!-- Carta plegada en tres partes -->
        <article class="letter" id="letter" aria-live="polite">
          <div class="letter__panel letter__panel--mid">
            <div class="letter__face">
              <div class="letter__divider" aria-hidden="true"><span></span><svg><use href="#s-estrella"/></svg><span></span></div>
              <p class="letter__message" data-content="carta.mensaje"></p>
            </div>
          </div>
          <div class="letter__panel letter__panel--bottom">
            <div class="letter__face letter__face--front">
              <p class="letter__sign"><span class="script" data-content="carta.firma"></span><strong data-content="organizacion"></strong></p>
              <button class="btn btn--gold letter__cta" id="letter-cta" type="button" tabindex="-1">
                <span data-content="carta.boton"></span>
                <svg class="icon"><use href="#i-flecha"/></svg>
              </button>
            </div>
            <div class="letter__face letter__face--back"></div>
          </div>
          <div class="letter__panel letter__panel--top">
            <div class="letter__face letter__face--front">
              <svg class="letter__holly" aria-hidden="true"><use href="#s-acebo"/></svg>
              <p class="letter__greeting script" data-content="carta.saludo"></p>
              <h2 class="letter__org" data-content="organizacion"></h2>
            </div>
            <div class="letter__face letter__face--back">
              <svg class="letter__star" aria-hidden="true"><use href="#s-belen"/></svg>
              <p class="script" data-content="sobre.destinatario"></p>
            </div>
          </div>
        </article>

        <div class="env env--front" aria-hidden="true">
          <svg viewBox="0 0 100 64" preserveAspectRatio="none">
            <defs>
              <linearGradient id="g-env-side" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#8e0000"/><stop offset="1" stop-color="#b80000"/>
              </linearGradient>
              <linearGradient id="g-env-side-r" x1="1" y1="0" x2="0" y2="0">
                <stop offset="0" stop-color="#8e0000"/><stop offset="1" stop-color="#b80000"/>
              </linearGradient>
              <linearGradient id="g-env-bottom" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0" stop-color="#a00000"/><stop offset="1" stop-color="#d00000"/>
              </linearGradient>
            </defs>
            <path d="M0 0 L47 35 L0 64Z" fill="url(#g-env-side)"/>
            <path d="M100 0 L53 35 L100 64Z" fill="url(#g-env-side-r)"/>
            <path d="M0 64 L44 31.5 Q50 27.5 56 31.5 L100 64Z" fill="url(#g-env-bottom)"/>
            <path d="M0.5 63.5 L44 31.5 Q50 27.5 56 31.5 L99.5 63.5" fill="none" stroke="url(#g-gold)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
          </svg>
        </div>

        <div class="env env--flap" aria-hidden="true">
          <div class="flap__face flap__face--out">
            <svg viewBox="0 0 100 60" preserveAspectRatio="none">
              <defs>
                <linearGradient id="g-env-flap" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#c40000"/><stop offset="1" stop-color="#9a0000"/>
                </linearGradient>
              </defs>
              <path d="M0 0 H100 L54 56 Q50 60 46 56Z" fill="url(#g-env-flap)"/>
              <path d="M0.5 0.5 L46 56 Q50 60 54 56 L99.5 0.5" fill="none" stroke="url(#g-gold)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
            </svg>
          </div>
          <div class="flap__face flap__face--in">
            <svg viewBox="0 0 100 60" preserveAspectRatio="none">
              <path d="M0 60 H100 L54 4 Q50 0 46 4Z" fill="url(#p-liner)"/>
            </svg>
          </div>
        </div>

        <div class="seal" aria-hidden="true">
          <span class="seal__ring"></span>
          <div class="seal__half seal__half--l"><svg viewBox="0 0 100 100"><use href="#s-sello"/></svg></div>
          <div class="seal__half seal__half--r"><svg viewBox="0 0 100 100"><use href="#s-sello"/></svg></div>
          <div class="seal__burst"></div>
        </div>

        <button class="scene__hit" id="open-envelope" type="button" aria-label="Abrir el sobre de la invitación"></button>
      </div>
    </div>

    <p class="intro__hint" aria-hidden="true">
      <span class="intro__hint-dot"></span><span data-content="sobre.indicacion"></span>
    </p>
    <button class="intro__skip" id="intro-skip" type="button">Saltar animación</button>
  </div>

  <!-- ============ 2. PÁGINA PRINCIPAL ============ -->
  <main class="main" id="main">

    <!-- A. Bienvenida -->
    <section class="hero" id="bienvenida" aria-labelledby="hero-title">
      <div class="hero__sky" aria-hidden="true" data-parallax="0.25">
        <div class="sparkles" data-sparkles="26"></div>
      </div>
      <div class="hero__garland" aria-hidden="true" data-garland></div>
      <svg class="hero__pine hero__pine--l" aria-hidden="true" data-parallax="0.12"><use href="#s-pino"/></svg>
      <svg class="hero__pine hero__pine--r" aria-hidden="true" data-parallax="0.12"><use href="#s-pino"/></svg>
      <div class="hero__ornaments" aria-hidden="true" data-ornaments></div>

      <div class="hero__content" data-parallax="-0.08">
        <svg class="hero__star" aria-hidden="true"><use href="#s-belen"/></svg>
        <p class="kicker kicker--lines hero__kicker" data-content="bienvenida.antetitulo"></p>
        <h2 class="hero__title" id="hero-title" data-hero-title data-content="bienvenida.titulo"></h2>
        <div class="ornament-divider hero__divider" aria-hidden="true"><span></span><svg><use href="#s-estrella"/></svg><span></span></div>
        <p class="hero__org" data-content="bienvenida.subtitulo"></p>
        <p class="hero__phrase script" data-content="bienvenida.frase"></p>
        <p class="hero__badge">Navidad <span data-content="bienvenida.anio"></span></p>
      </div>

      <a class="scroll-cue" href="#invitacion" aria-label="Ir a la invitación">
        <span>Desliza</span>
        <svg class="icon"><use href="#i-flecha"/></svg>
      </a>
      <svg class="divider divider--arc" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
        <path class="divider__fill" d="M0 120 V70 Q720 -30 1440 70 V120Z"/>
        <path class="divider__line" d="M0 70 Q720 -30 1440 70"/>
      </svg>
    </section>

    <!-- B. Invitación especial -->
    <section class="invite" id="invitacion" aria-labelledby="invite-title">
      <div class="invite__card" data-reveal="zoom">
        <svg class="corner corner--tl" aria-hidden="true"><use href="#s-acebo"/></svg>
        <svg class="corner corner--br" aria-hidden="true"><use href="#s-acebo"/></svg>
        <div class="invite__wreath" aria-hidden="true" data-wreath></div>
        <p class="kicker-script" data-reveal="up" data-content="invitacion.antetitulo"></p>
        <h2 class="section-title" id="invite-title" data-reveal="up" style="--d: .1s" data-content="invitacion.titulo"></h2>
        <div class="ornament-divider ornament-divider--dark" aria-hidden="true" data-reveal="width"><span></span><svg><use href="#s-estrella"/></svg><span></span></div>
        <div class="invite__text" data-list="invitacion.parrafos"></div>
        <p class="invite__sign" data-reveal="up"><span class="script" data-content="invitacion.despedida"></span><strong data-content="invitacion.firma"></strong></p>
      </div>
      <svg class="divider divider--wave" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
        <path class="divider__fill" d="M0 120 V60 C240 110 480 10 720 60 S1200 10 1440 60 V120Z"/>
        <path class="divider__line" d="M0 60 C240 110 480 10 720 60 S1200 10 1440 60"/>
      </svg>
    </section>

    <!-- C. Programa -->
    <section class="program" id="programa" aria-labelledby="program-title">
      <div class="program__glow" aria-hidden="true"></div>
      <header class="section-head">
        <p class="kicker kicker--lines" data-reveal="up" data-content="programa.antetitulo"></p>
        <h2 class="section-title section-title--light" id="program-title" data-reveal="up" style="--d: .1s" data-content="programa.titulo"></h2>
        <p class="section-lead" data-reveal="up" style="--d: .2s" data-content="programa.introduccion"></p>
      </header>
      <div class="timeline" id="timeline">
        <div class="timeline__track" aria-hidden="true"><span class="timeline__progress"></span></div>
        <!-- Contenido generado desde config.js -->
      </div>
      <svg class="divider divider--peaks" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
        <path class="divider__fill" d="M0 120 V80 L180 50 L360 80 L540 40 L720 75 L900 40 L1080 80 L1260 50 L1440 80 V120Z"/>
        <path class="divider__line" d="M0 80 L180 50 L360 80 L540 40 L720 75 L900 40 L1080 80 L1260 50 L1440 80"/>
      </svg>
    </section>

    <!-- D. Fecha y lugar -->
    <section class="details" id="fecha-lugar" aria-labelledby="details-title">
      <header class="section-head">
        <p class="kicker kicker--lines" data-reveal="up" data-content="fechaLugar.antetitulo"></p>
        <h2 class="section-title section-title--light" id="details-title" data-reveal="up" style="--d: .1s" data-content="fechaLugar.titulo"></h2>
      </header>

      <div class="details__grid">
        <article class="info-card" data-reveal="up">
          <span class="info-card__icon"><svg class="icon"><use href="#i-calendario"/></svg></span>
          <p class="info-card__label">Fecha</p>
          <p class="info-card__value" data-content="fechaLugar.fecha"></p>
        </article>
        <article class="info-card" data-reveal="up" style="--d: .12s">
          <span class="info-card__icon"><svg class="icon"><use href="#i-reloj"/></svg></span>
          <p class="info-card__label">Hora de inicio</p>
          <p class="info-card__value" data-content="fechaLugar.horaInicio"></p>
        </article>
      </div>

      <div class="countdown" id="countdown" hidden data-reveal="up">
        <p class="countdown__title script">Faltan</p>
        <div class="countdown__grid">
          <div><strong data-cd="d">0</strong><span>días</span></div>
          <div><strong data-cd="h">0</strong><span>horas</span></div>
          <div><strong data-cd="m">0</strong><span>min</span></div>
          <div><strong data-cd="s">0</strong><span>seg</span></div>
        </div>
      </div>

      <div class="places" id="places"><!-- Generado desde config.js --></div>

      <div class="details__actions" data-reveal="up">
        <button class="btn btn--ivory" id="add-calendar" type="button" hidden>
          <svg class="icon"><use href="#i-agregar"/></svg><span>Agregar al calendario</span>
        </button>
      </div>
      <p class="details__note" data-reveal="up" data-content="fechaLugar.nota"></p>

      <svg class="divider divider--arc-down" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
        <path class="divider__fill" d="M0 120 V40 Q720 140 1440 40 V120Z"/>
        <path class="divider__line" d="M0 40 Q720 140 1440 40"/>
      </svg>
    </section>

    <!-- E. Mensaje de cierre -->
    <section class="closing" id="cierre" aria-labelledby="closing-title">
      <div class="sparkles" data-sparkles="30" aria-hidden="true"></div>
      <div class="closing__star" aria-hidden="true" data-reveal="zoom">
        <span class="closing__rays"></span>
        <svg><use href="#s-belen"/></svg>
      </div>
      <blockquote class="closing__quote script" data-reveal="up" data-content="cierre.frase"></blockquote>
      <h2 class="closing__title" id="closing-title" data-reveal="up" style="--d: .15s" data-content="cierre.invitacion"></h2>
      <p class="closing__sign" data-reveal="up" style="--d: .25s" data-content="cierre.firma"></p>
      <button class="btn btn--gold" id="share" type="button" data-reveal="up" style="--d: .35s">
        <svg class="icon"><use href="#i-compartir"/></svg><span data-content="cierre.compartir"></span>
      </button>
      <div class="closing__forest" aria-hidden="true" data-forest></div>
      <footer class="footer">
        <p>Navidad <span data-content="bienvenida.anio"></span> · <span data-content="organizacion"></span></p>
      </footer>
    </section>
  </main>

  <!-- Reproductor de música -->
  <button class="music" id="music" type="button" aria-pressed="false" aria-label="Reproducir música">
    <span class="music__ring" aria-hidden="true"></span>
    <svg class="icon music__icon" aria-hidden="true"><use href="#i-nota"/></svg>
    <span class="music__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">Para disfrutar la invitación, activa JavaScript en tu navegador.</div>
  </noscript>
</body>
</html>
